<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Email Editor</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- marked.js for Markdown to HTML conversion -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- turndown.js for HTML to Markdown conversion -->
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <style>
        /* Custom styles for a better look and feel */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: #f0f0f0;
        }
        .editor-pane {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 1rem;
            height: 100%;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #e0e0e0;
            resize: none;
        }
        /* Iframe styling */
        #wysiwygFrame {
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #ffffff; /* White background for loading */
        }
        .toolbar-btn {
            background-color: #3a3a3a;
            color: #f0f0f0;
            border: 1px solid #555;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .toolbar-btn:hover {
            background-color: #4a4a4a;
        }
        .toolbar-btn.active {
            background-color: #007acc;
            border-color: #005d9c;
        }
        label {
            color: #bbb;
        }
        input[type="text"], input[type="url"] {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 0.5rem;
            width: 100%;
            color: #f0f0f0;
        }
        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: #007acc;
        }
        .copy-btn {
            background-color: #007acc;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .copy-btn:hover {
            background-color: #005d9c;
        }
        /* Toggle Switch Styles */
        .toggle-label {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        .toggle-label input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #4a4a4a;
            transition: .4s;
            border-radius: 28px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #007acc;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="p-4 md:p-8">

    <div class="max-w-screen-2xl mx-auto">
        <header class="mb-6">
            <h1 class="text-3xl font-bold text-white">WYSIWYG Email Editor</h1>
            <p class="text-gray-400">Edit content in any pane and see it update in real-time.</p>
        </header>

        <!-- Main Editor Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4" style="height: 70vh;">
            <!-- Pane 1: WYSIWYG Iframe Editor -->
            <div class="flex flex-col gap-4">
                <h2 class="text-xl font-semibold text-gray-300">WYSIWYG Preview</h2>
                <div class="toolbar flex flex-wrap gap-2 p-3 bg-gray-800 rounded-lg border border-gray-700">
                    <button class="toolbar-btn" data-command="bold"><b>B</b></button>
                    <button class="toolbar-btn" data-command="italic"><i>I</i></button>
                    <button class="toolbar-btn" data-command="underline"><u>U</u></button>
                    <button class="toolbar-btn" data-command="formatBlock" data-value="h1">H1</button>
                    <button class="toolbar-btn" data-command="formatBlock" data-value="h2">H2</button>
                    <button class="toolbar-btn" data-command="formatBlock" data-value="h3">H3</button>
                    <button class="toolbar-btn" data-command="insertUnorderedList">UL</button>
                    <button class="toolbar-btn" data-command="insertOrderedList">OL</button>
                    <button class="toolbar-btn" data-command="createLink">Link</button>
                    <button class="toolbar-btn" data-command="removeFormat">Clear</button>
                </div>
                <iframe id="wysiwygFrame" class="w-full flex-grow"></iframe>
            </div>

            <!-- Pane 2: Markdown Editor -->
            <div class="flex flex-col gap-4">
                <h2 class="text-xl font-semibold text-gray-300">Markdown</h2>
                <textarea id="markdownEditor" class="editor-pane flex-grow"></textarea>
            </div>

            <!-- Pane 3 & 4: HTML and Plain Text -->
            <div class="flex flex-col gap-4 h-full">
                <div class="flex flex-col gap-4 h-1/2">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-semibold text-gray-300">Body HTML</h2>
                        <button id="copyBodyHtmlButton" class="copy-btn">Copy</button>
                    </div>
                    <textarea id="htmlEditor" class="editor-pane flex-grow"></textarea>
                </div>
                <div class="flex flex-col gap-4 h-1/2">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-semibold text-gray-300">Plain Text</h2>
                        <button id="copyPlainTextButton" class="copy-btn">Copy</button>
                    </div>
                    <textarea id="plainTextEditor" class="editor-pane flex-grow"></textarea>
                </div>
            </div>
        </div>

        <!-- CTA and Final Output Section -->
        <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- CTA Controls -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Call to Action (CTA) Button</h2>
                    <label class="toggle-label">
                        <input type="checkbox" id="ctaToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="space-y-4">
                    <div>
                        <label for="ctaLink" class="block mb-1 text-sm font-medium">CTA Link URL</label>
                        <input type="url" id="ctaLink" placeholder="https://example.com" value="https://90x90plays.com">
                    </div>
                    <div>
                        <label for="ctaText" class="block mb-1 text-sm font-medium">CTA Button Text</label>
                        <input type="text" id="ctaText" placeholder="Click Here" value="Learn More">
                    </div>
                </div>
            </div>

            <!-- Final Email HTML -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Final Email HTML</h2>
                    <button id="copyFinalHtmlButton" class="copy-btn" style="padding: 0.75rem 1.5rem;">Copy HTML</button>
                </div>
                <textarea id="finalHtmlOutput" class="editor-pane flex-grow" readonly></textarea>
            </div>
        </div>
    </div>

    <script>
        // --- EMAIL TEMPLATES AND CONSTANTS ---
        const emailTemplateWrapper = `
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <title>90x90 Playwriting Challenge</title>
    <!--[if mso]>
        <style>
            * {
                font-family: sans-serif !important;
            }
        </style>
    <![endif]-->
    <style>
        html, body {
            margin: 0 auto !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
            background: #ffffff;
        }
        table,
        td {
            mso-table-lspace: 0pt !important;
            mso-table-rspace: 0pt !important;
        }
        table {
            border-spacing: 0 !important;
            border-collapse: collapse !important;
            table-layout: fixed !important;
            margin: 0 auto !important;
        }
        img {
            -ms-interpolation-mode:bicubic;
        }
        a {
            text-decoration: none;
        }
        * [style*="font-size: 16px"] {
            font-size: 16px !important;
        }
        @media screen and (max-width: 600px) {
            .email-container {
                width: 100% !important;
                margin: auto !important;
            }
        }
        /* Style for the editable area */
        [contenteditable="true"]:focus {
            outline: 2px solid #007acc;
        }
    </style>
</head>
<body width="100%" style="margin: 0; padding: 0 !important; mso-line-height-rule: exactly; background-color: #ffffff;">
    <center style="width: 100%; background-color: #ffffff;">
        <table align="center" role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" style="margin: auto;" class="email-container">
            <tr>
                <td style="background-color: #ffffff;">
                    <a href="https://90x90plays.com">
                        <img alt="Image of a typewriter on a blue background with the text '90x90 Playwriting Challenge'" src="https://images.squarespace-cdn.com/content/v1/686e9ecae63e0b48578a25ca/8f9a3ace-34bb-4f37-927b-b6a540b64eb1/email-header+660+x+300+px%29.png?format=2500w" width="600" height="" border="0" style="width: 100%; max-width: 600px; height: auto; background: #dddddd; font-family: sans-serif; font-size: 15px; line-height: 15px; color: #555555; display: block;">
                    </a>
                </td>
            </tr>
            <tr>
                <td style="background-color: #E1DFD9;">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                        <tr>
                            <!-- IMPORTANT: Added id="email-body-cell" to this TD -->
                            <td id="email-body-cell" style="padding: 20px; font-family: Arial, sans-serif; font-size: 16px; line-height: 24px; color: #555555; text-align: left;">
                                %email_body%
                                %cta_button%
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
            <tr>
                <td style="padding: 20px; font-family: Arial, sans-serif; font-size: 12px; line-height: 18px; text-align: center; color: #888888;">
                    <p style="margin: 0 0 5px 0;">90x90 Plays</p>
                    <p style="margin: 0;">
                        <a href="http://90x90plays.com/leave-challenge" style="color: #888888; text-decoration: underline;">Leave the Challenge</a>
                    </p>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
`;
        const emailCtaButtonHtml = `
<br>
<table role="presentation" cellspacing="0" cellpadding="0" border="0" align="center" style="margin: auto;">
  <tr>
      <td style="border-radius: 3px; background: #222222; text-align: center;" class="button-td">
          <a href="%cta_link%" style="background: #222222; border: 15px solid #222222; font-family: sans-serif; font-size: 13px; line-height: 1.1; text-align: center; text-decoration: none; display: block; border-radius: 3px; font-weight: bold;" class="button-a">
              <span style="color:#ffffff;" class="button-link">&nbsp;&nbsp;&nbsp;&nbsp;%cta_text%&nbsp;&nbsp;&nbsp;&nbsp;</span>
          </a>
      </td>
  </tr>
</table>
`;
        const emailBodyPtrn = '%email_body%';
        const emailCtaButtonPtrn = '%cta_button%';
        const emailCtaLinkPtrn = '%cta_link%';
        const emailCtaTextPtrn = '%cta_text%';

        // --- DOM ELEMENT REFERENCES ---
        const wysiwygFrame = document.getElementById('wysiwygFrame');
        const markdownEditor = document.getElementById('markdownEditor');
        const htmlEditor = document.getElementById('htmlEditor');
        const plainTextEditor = document.getElementById('plainTextEditor');
        const ctaLinkInput = document.getElementById('ctaLink');
        const ctaTextInput = document.getElementById('ctaText');
        const ctaToggle = document.getElementById('ctaToggle');
        const finalHtmlOutput = document.getElementById('finalHtmlOutput');
        const copyFinalHtmlButton = document.getElementById('copyFinalHtmlButton');
        const copyBodyHtmlButton = document.getElementById('copyBodyHtmlButton');
        const copyPlainTextButton = document.getElementById('copyPlainTextButton');
        const toolbar = document.querySelector('.toolbar');
        
        // --- Globals for iframe content ---
        let wysiwygDoc = null;
        let editableCell = null; // This will now be the DIV inside the TD

        // --- INITIALIZATION ---
        const turndownService = new TurndownService();
        let isUpdating = false; // A flag to prevent infinite update loops

        // --- CORE LOGIC ---

        /**
         * The main function to synchronize content across all panes.
         * @param {string} source - The ID of the editor that triggered the update.
         */
        function updatePanes(source) {
            if (isUpdating) return;
            isUpdating = true;

            let html = '';
            let markdown = '';
            let plainText = '';

            try {
                switch (source) {
                    case 'wysiwygFrame':
                        html = editableCell.innerHTML;
                        markdown = turndownService.turndown(html);
                        plainText = editableCell.innerText;
                        
                        if (markdownEditor.value !== markdown) markdownEditor.value = markdown;
                        if (htmlEditor.value !== html) htmlEditor.value = html;
                        if (plainTextEditor.value !== plainText) plainTextEditor.value = plainText;
                        break;

                    case 'markdownEditor':
                        markdown = markdownEditor.value;
                        html = marked.parse(markdown);
                        
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = html;
                        plainText = tempDiv.innerText;

                        if (editableCell.innerHTML !== html) editableCell.innerHTML = html;
                        if (htmlEditor.value !== html) htmlEditor.value = html;
                        if (plainTextEditor.value !== plainText) plainTextEditor.value = plainText;
                        break;

                    case 'htmlEditor':
                        html = htmlEditor.value;
                        markdown = turndownService.turndown(html);
                        
                        if (editableCell.innerHTML !== html) editableCell.innerHTML = html;
                        plainText = editableCell.innerText;

                        if (markdownEditor.value !== markdown) markdownEditor.value = markdown;
                        if (plainTextEditor.value !== plainText) plainTextEditor.value = plainText;
                        break;
                    
                    case 'plainTextEditor':
                        plainText = plainTextEditor.value;
                        html = plainText.replace(/\n/g, '<br>');
                        markdown = turndownService.turndown(html);

                        if (editableCell.innerHTML !== html) editableCell.innerHTML = html;
                        if (htmlEditor.value !== html) htmlEditor.value = html;
                        if (markdownEditor.value !== markdown) markdownEditor.value = markdown;
                        break;
                }
            } catch (error) {
                console.error("Error during pane update:", error);
            }

            compileFinalHtml();
            isUpdating = false;
        }

        /**
         * Updates the CTA button preview inside the iframe.
         */
        function updateIframeCta() {
            if (!wysiwygDoc) return;
            const ctaContainer = wysiwygDoc.getElementById('cta-preview-container');
            if (!ctaContainer) return;

            const ctaLink = ctaLinkInput.value;
            const ctaText = ctaTextInput.value;
            const ctaEnabled = ctaToggle.checked;

            if (ctaEnabled && ctaLink && ctaText) {
                const ctaButton = emailCtaButtonHtml
                    .replace(emailCtaLinkPtrn, ctaLink)
                    .replace(emailCtaTextPtrn, ctaText);
                ctaContainer.innerHTML = ctaButton;
            } else {
                ctaContainer.innerHTML = '';
            }
        }

        /**
         * Compiles the final email HTML by injecting the body and CTA into the wrapper.
         */
        function compileFinalHtml() {
            const emailBody = htmlEditor.value;
            const ctaLink = ctaLinkInput.value;
            const ctaText = ctaTextInput.value;
            const ctaEnabled = ctaToggle.checked;

            let ctaButton = '';
            if (ctaEnabled && ctaLink && ctaText) {
                ctaButton = emailCtaButtonHtml
                    .replace(emailCtaLinkPtrn, ctaLink)
                    .replace(emailCtaTextPtrn, ctaText);
            }
            
            let finalHtml = emailTemplateWrapper.replace(emailBodyPtrn, emailBody);
            finalHtml = finalHtml.replace(emailCtaButtonPtrn, ctaButton);
            finalHtmlOutput.value = finalHtml;
        }

        // --- EVENT LISTENERS ---

        markdownEditor.addEventListener('input', () => updatePanes('markdownEditor'));
        htmlEditor.addEventListener('input', () => updatePanes('htmlEditor'));
        plainTextEditor.addEventListener('input', () => updatePanes('plainTextEditor'));
        
        ctaToggle.addEventListener('change', () => {
            updateIframeCta();
            compileFinalHtml();
        });
        ctaLinkInput.addEventListener('input', () => {
            updateIframeCta();
            compileFinalHtml();
        });
        ctaTextInput.addEventListener('input', () => {
            updateIframeCta();
            compileFinalHtml();
        });

        // Toolbar button functionality
        toolbar.addEventListener('click', (e) => {
            const button = e.target.closest('button');
            if (!button) return;
            
            editableCell.focus(); // Focus the editable div
            const { command, value } = button.dataset;

            if (command === 'createLink') {
                const url = prompt('Enter the URL:');
                if (url) {
                    wysiwygDoc.execCommand(command, false, url);
                }
            } else {
                wysiwygDoc.execCommand(command, false, value);
            }
            
            updatePanes('wysiwygFrame');
        });

        // --- Clipboard Functionality ---
        function setupCopyButton(button, textarea, originalText) {
            button.addEventListener('click', () => {
                textarea.select();
                document.execCommand('copy');
                button.textContent = 'Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            });
        }

        setupCopyButton(copyFinalHtmlButton, finalHtmlOutput, 'Copy HTML');
        setupCopyButton(copyBodyHtmlButton, htmlEditor, 'Copy');
        setupCopyButton(copyPlainTextButton, plainTextEditor, 'Copy');

        // --- INITIAL LOAD ---
        function initializeEditor() {
            const initialContent = `<h1>Welcome to the Editor!</h1><p>This is a sample paragraph. You can <b>bold</b> text, <i>italicize</i> it, or even create lists.</p><ul><li>First item</li><li>Second item</li></ul><p>Start typing in the preview pane to see the magic happen.</p>`;
            
            const iframeSrc = emailTemplateWrapper
                .replace(emailBodyPtrn, '')
                .replace(emailCtaButtonPtrn, '');

            wysiwygDoc = wysiwygFrame.contentWindow.document;
            wysiwygDoc.open();
            wysiwygDoc.write(iframeSrc);
            wysiwygDoc.close();

            const originalCell = wysiwygDoc.getElementById('email-body-cell');
            if (originalCell) {
                // Create a div for the editable content to isolate it from the CTA
                editableCell = wysiwygDoc.createElement('div');
                editableCell.contentEditable = true;
                editableCell.innerHTML = initialContent;
                
                // Create the non-editable container for the CTA button preview
                const ctaContainer = wysiwygDoc.createElement('div');
                ctaContainer.id = 'cta-preview-container';

                // Clear the original cell and append our new structured elements
                originalCell.innerHTML = '';
                originalCell.appendChild(editableCell);
                originalCell.appendChild(ctaContainer);

                // Add the input listener to the new editable div
                editableCell.addEventListener('input', () => updatePanes('wysiwygFrame'));
            } else {
                console.error("Editable cell container not found in iframe.");
            }

            // Perform the initial sync from the iframe to all other panes
            updatePanes('wysiwygFrame');
            // Show the initial CTA button preview
            updateIframeCta();
        }

        window.onload = initializeEditor;

    </script>
</body>
</html>
